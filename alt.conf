# ----------------------------
# Basic interface & logging
# ----------------------------
port=0             # disable DNS
interface=ens33        # replace with your PXE network interface (on host)
bind-interfaces
log-dhcp               # logs DHCP requests for debugging

# ----------------------------
# DHCP IP range
# ----------------------------
dhcp-range=192.168.0.10,192.168.0.250,12h

# ----------------------------
# PXE boot options
# ----------------------------
# IP of your netboot.xyz container (TFTP server)

# BIOS / legacy PXE
dhcp-boot=netboot.xyz.kpxe,,192.168.0.212

# UEFI x86_64 PXE
dhcp-match=set:efi,option:client-arch,7
dhcp-boot=netboot.xyz.efi,,192.168.0.212

# Optional: UEFI x86_32 (rare)
dhcp-match=set:efi32,option:client-arch,6
dhcp-boot=netboot.xyz.efi,,192.168.0.212

dhcp-option=66,"0.0.0.0"

dhcp-option=6,192.168.0.1   # dns server
dhcp-option=3,192.168.0.1   # default gateway

# ----------------------------
# Optional debugging
# ----------------------------
#log-dhcp
#dhcp-leasefile=/var/lib/misc/dnsmasq.leases

